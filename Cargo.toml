[package]
name = "gh-dependabot-repos"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/graphql-query-macro"]
resolver = "3"

[dependencies]
anyhow = "1"
futures = "0.3"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
clap = { version = "4", features = ["derive"] }
graphql-query-macro = { path = "crates/graphql-query-macro" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }
